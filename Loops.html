<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Loops, Methods and Switches in JavaScript</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <h1>Loops, Methods and Switches in JavaScript</h1>
        
        <script>
          var str="Hello World";
          document.write(str.toUpperCase());
          document.write("<br>");
          document.write(str.toLowerCase());
           document.write("<br>");
           document.write(str.startsWith("H"));
           document.write("<br>");
           document.write(str.endsWith("l"));

           document.write("<br>");
           var Num=3;
           switch(Num) {
            case 1:
            document.write("The number is 1");
             break;

             case 2:
            document.write("The number is 2");
            break;

            case 3:
             document.write("The number is 3");
             break;

            default:
            document.write("The number is not 1, 2 or 3");

           }

           document.write("<br>");

           document.write("The number is:" + Num);

           document.write("<br>");

           document.write("Loops");
           for( i=0; i<=5; i++){
            document.write("The number is" + i);
           }

        </script>
    </body>
</html>
