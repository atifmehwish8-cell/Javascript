    <body>
    <h2>Object data structure and Array inJavaScript</h2>

        
       <script>
        var object = {
            name: "John",
            age: "20",
            city: "New York",
            Favouritecolor: "Blue",
            hobbie: "swimming",
        }
        
        var array = ["Green", "blue", "Red", "yellow", "pink", "orange"];
        document.write("The person's name is  "  +  object.name + "<br>");
        document.write("John's age is" + object.age + "<br>");
        document.write("Before popping the array is " + array.join(","));
        document.write("<br>");
        document.write("John's Favourite color is" + array[1] + "<br>");
        array.pop();
        document.write("After popping the array is" + array.join(","));
       </script>
    </body>
