<html>

        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">

    <body>
      <h1>Simple Calculator</h1>
      <p>Perform basic arithmetic operations using JavaScript.</p>
      <p id="add"></p>
      <p id="sub"></p>
      <p id="mul"></p>
      <p id="div"></p>
        <script>
         var num1 =46;
         var num2 = 14;
         var add = num1 + num2;
         var sub = num1 - num2;
         var mul = num1 * num2;
         var div = num1 / num2;

         document.getElementById("add").innerHTML = "The added value is:" + add;
         document.getElementById("sub").innerHTML = "The subtracted value is:" + sub;
         document.getElementById("mul").innerHTML = "The multiplied value is:" + mul;
         document.getElementById("div").innerHTML = "The divided value is:" + div;        </script>
    </body>
