<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Introduction to HTML DOM</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
       <h1>ZOO</h1> 
       <p>Details of the zoo.</p>
       <div id="zoo">
        <div id="zone">Zone 1 <span id="zone1"></span></div>
        <div id="zone">Zone 2 <span id="zone2"></span></div>
        <div id="zone">Zone 3 <span id="zone3"></span></div>
        <div id="total">Total: <span id="totalCount"></span></div>
        <button onClick="openZoo()">Open Zoo</button>
        <p id="zoo-status"></p>
       </div>
        
        <script>
            function openZoo() {
                document.getElementById("zone1").innerHTML = "Lion";
                document.getElementById("zone2").innerHTML = "Tiger";
                document.getElementById("zone3").innerHTML = "Elephant";
                document.getElementById("totalCount").innerHTML = "3";
                document.getElementById("zoo").style.backgroundColor = "lightpink";
                document.getElementById("zoo-status").innerHTML = document.title + " Zoo is now open!";
            }
        </script>
    </body>
</html>
