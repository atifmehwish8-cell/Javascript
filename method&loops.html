        <title>Methods and Loops Project</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <h2>Methods and Loops in JavaScript</h2>
        <p> Numbers from 1 to 10: </p>
        <p id="results"></p>
        <script>
      var number="";
      for (i=0; i<=10; i++){
        number += i + "<br>";
      }
      document.getElementById("results").innerHTML = number;
      document.write("The random numbers are: "+ Math.floor(Math.random() * 10));
      var date= new Date();
      document.write("<br>");
      document.write("Today's date is:"+ date.getDate());
        </script>
    </body>
</html>
