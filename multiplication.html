<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Multiplication using Functions in JavaScript</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>

    <style>
      h1 {
        color:rgb(68, 68, 166);
        background-color:rgb(206, 208, 211);
        border: 3px solid gray;
        border-radius: 10px;
        font-family:'Times New Roman', Times, serif;
      }

      button {
        background-color:rgb(214, 247, 247);
        border: 3px solid crimson;
        border-radius: 10px;
        font-family:'Times New Roman', Times, serif;
      }
    </style>
    <body>
        <h1>Multiplication using Functions in JavaScript</h1>
       <button onclick="multiply(4)">Click Me</button>
        <p id="result"></p>
        <script>
            function multiply(a,b) {
                if(b===undefined){
                    b=7;
                }
                var result = a * b;
                document.getElementById("result").innerHTML = "The result is: " + result;
            }
            
        </script>
    </body>
</html>
