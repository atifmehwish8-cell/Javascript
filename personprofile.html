<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>My Favourite Person Profile</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="py-4">
        <div class="container">
            <h1 class="mb-1">My Favourite Person Profile</h1>
            <p class="text-muted mb-4">Introductions to Objects in JavaScript</p>
            <div class="card shadow-sm mb-3" style="max-width:400px;">
                <div class="card-body">
                    <h5 class="card-title" style="color: #007bff;">Profile Details</h5>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <span class="card-label d-block">Name</span>
                            <strong id="name">-</strong>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">
                                <strong id="relationship">-</strong>
                            </span>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">
                                <strong id="activity">-</strong>
                            </span>
                        </li>
                        <li class="list-group-item">
                            <span class="card-label d-block">
                                <strong id="city"></strong>
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
        
         <div class="card shadow-sm"style="max-width:400px";>
            <div class="card-body">
                <h6 style="color:#FF5A43;">JavaScript Objects Used</h6>
                <pre id="codedisplay" class="bg-light p-3 rounded border mb-0"></pre>
            </div>
         </div>
        </div>

       <script>
        var favouriteperson = {
            name: "Beenish Khan",
            relationship: "My Friend",
            activity: "Spending time together",
            city: "Karachi", 
        };

        var nameEl= document.getElementById("name");
        var relationshipEl = document.getElementById("relationship");
        nameEl.textContent = favouriteperson.name;
        relationshipEl.textContent = favouriteperson.relationship;

        var activityEl = document.getElementById("activity");
        var cityEl = document.getElementById("city");
        activityEl.textContent = favouriteperson["activity"];
        cityEl.textContent = favouriteperson["city"];

        var codeDisplayEl = document.getElementById("codedisplay");
        codedisplayEl.textContent =
        'var favouriteperson = {\n' + 
    ' name:  "Beenish Khan",\n' +
    ' relationship: "My Friend",\n' +
    ' activity: "Spending time together",\n' +
    ' city: "Karachi",\n'  +
     '};';
       </script>
    </body>
</html>
